services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-api
    ports:
      - "3000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/employee_db
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: employee-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: